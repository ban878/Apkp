name: بناء Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: استلام الكود
      uses: actions/checkout@v4

    - name: إعداد Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        # إضافة خاصية الـ cache لتسريع البناء مستقبلاً
        cache: 'gradle'

    - name: منح صلاحيات Gradle
      # نستخدم "shell: bash" ونحدد المسار بدقة مع علامات الاقتباس
      run: |
        cd "نسخه نص"
        chmod +x gradlew
      shell: bash

    - name: بناء Release APK
      run: |
        cd "نسخه نص"
        ./gradlew assembleRelease --stacktrace
      shell: bash

    - name: رفع APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        # تأكد أن هذا المسار يطابق بنية مجلدات مشروعك بدقة
        path: "نسخه نص/app/build/outputs/apk/release/*.apk"
    
    - name: رفع APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: "نسخه نص/app/build/outputs/apk/release/*.apk"    
