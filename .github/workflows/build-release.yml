name: بناء Release APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: استلام الكود
      uses: actions/checkout@v4

    - name: إعداد Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: منح صلاحيات Gradle وبناء التطبيق
      run: |
        # استبدل "نسخه نص" بالاسم الدقيق للمجلد كما هو في GitHub
        cd "نسخه نص" 
        chmod +x gradlew
        ./gradlew assembleRelease --stacktrace
      shell: bash

    - name: رفع الملف الناتج
      uses: actions/upload-artifact@v4
      with:
        name: UniversalCopy-Release
        # المسار يجب أن يكون دقيقاً جداً
        path: "**/build/outputs/apk/release/*.apk"
